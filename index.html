<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>SchoolsOS AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function setAppHeight() {
          var h;
          if (window.visualViewport && window.visualViewport.height) {
            h = Math.round(window.visualViewport.height);
          } else {
            h = window.innerHeight || (document.documentElement && document.documentElement.clientHeight) || 0;
          }
          document.documentElement.style.setProperty("--app-height", h + "px");
        }
        setAppHeight();
        window.requestAnimationFrame(setAppHeight);
        window.setTimeout(setAppHeight, 50);
        window.setTimeout(setAppHeight, 300);
        window.addEventListener("resize", setAppHeight);
        window.addEventListener("orientationchange", setAppHeight);
        document.addEventListener("DOMContentLoaded", setAppHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", setAppHeight);
          window.visualViewport.addEventListener("scroll", setAppHeight);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
